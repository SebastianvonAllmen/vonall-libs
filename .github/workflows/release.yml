name: Release

# Merging to main with changesets present opens (or updates) the "Version Packages" pull request; merging that one
# builds every package and publishes the bumped ones to npm (`pnpm release`), then creates the GitHub releases.
# Setup: the repository secret NPM_TOKEN (a granular token with publish rights on @vonall only), until every package
# has trusted publishing configured on npmjs.com; then id-token below is what publishes.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
