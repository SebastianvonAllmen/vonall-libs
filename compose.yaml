# Postgres for the db tests: docker compose up -d --wait   (localhost:5437; TEST_DATABASE_URL in .env moves it)
name: vonall-libs

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vonall
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
